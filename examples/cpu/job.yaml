api_version: nucube/v1
name: deterministic-cpu-batches
runtime:
  image: python:3.12-slim
  command: [python, /workspace/analyze.py]
  source: ./source
tasks:
  - id: batch-001
    input: ./data/batch-001.json
  - id: batch-002
    input: ./data/batch-002.json
  - id: batch-003
    input: ./data/batch-003.json
  - id: batch-004
    input: ./data/batch-004.json
resources:
  cpu_per_worker: 1
  memory_mb_per_worker: 128
  max_workers: 2
limits:
  task_timeout_seconds: 120
  job_timeout_seconds: 600
  max_retries: 1
network: disabled
