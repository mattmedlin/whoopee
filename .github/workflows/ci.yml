name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.22'
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check src tests examples
      - run: uv run ruff format --check src tests examples
      - run: uv run mypy src
      - run: uv run pytest -q -m 'not docker'
      - run: docker pull python:3.12-slim
      - run: uv run pytest -q -m docker
        env:
          NUCUBE_DOCKER_TESTS: '1'
