[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "nucube"
version = "0.1.0"
description = "Give it a task. It builds the cluster. Local agentic batch compute."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.34,<1",
  "typer>=0.15,<1", "mcp>=1.9,<2", "docker>=7.1,<8",
  "httpx>=0.28,<1", "pyyaml>=6,<7",
]

[project.scripts]
nucube = "nucube.cli.main:app"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-PyYAML", "types-docker"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: requires a local Docker Engine and python:3.12-slim"]
